name: CI-CD

on:
  workflow_dispatch:
  schedule:
    # 06:00 UTC (03:00 BRT), todos os dias
    - cron: "0 6 * * *"
  pull_request:
  push:
    branches:
      - main

jobs:
  ci:
    name: Continuous Integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Python syntax
        run: |
          python -m py_compile app.py pipeline_botucatu.py caged_eventos.py cnpj_botucatu_etl.py comexstat_botucatu_etl.py scripts/sync_hf_dataset.py
          python -m py_compile scripts/run_comex_rastreabilidade.py
          python -m py_compile src/observatorio_comex/config.py src/observatorio_comex/contracts.py src/observatorio_comex/extract.py src/observatorio_comex/transform.py src/observatorio_comex/load.py src/observatorio_comex/pipeline.py

      - name: Streamlit smoke import
        run: python -c "import streamlit, pandas, plotly; print('deps ok')"

  refresh-data:
    name: Refresh Botucatu datasets
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run ETL pipeline
        run: python pipeline_botucatu.py

      - name: Sync Hugging Face dataset (opcional)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pip install -r requirements-hf.txt
          if [ -z "$HF_TOKEN" ]; then
            echo "HF_TOKEN ausente nos secrets do repositório — pulando Hub (Settings → Secrets → Actions)."
            exit 0
          fi
          python scripts/sync_hf_dataset.py

      - name: Commit refreshed CSVs (if changed)
        run: |
          git add caged_botucatu_q1_2026.csv caged_comparativo_municipios.csv financas_botucatu_2026.csv estban_botucatu_2025_2026.csv relatorio_botucatu_q1_2026.csv investimentos_botucatu_2026.csv
          for f in comex_botucatu_mensal.csv comex_botucatu_top_sh4_export.csv comex_botucatu_top_sh4_import.csv comex_botucatu_meta.csv; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          for f in cnpj_botucatu_resumo.csv cnpj_botucatu_mei_mensal.csv cnpj_botucatu_porte_pct.csv cnpj_botucatu_cnae_x_tipo.csv \
            cnpj_botucatu_join_empresas.csv cnpj_botucatu_meis.csv cnpj_botucatu_municipio_fonte.csv; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if git diff --staged --quiet; then
            echo "No dataset changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh Botucatu datasets via pipeline"
          git push

  cd:
    name: Continuous Delivery
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create deployable artifact
        run: |
          mkdir -p dist dist/data
          cp app.py requirements.txt README.md dist/
          if [ -f data/comex_sh4_cnae_aproximacao.csv ]; then cp data/comex_sh4_cnae_aproximacao.csv dist/data/; fi
          if [ -f relatorio_botucatu_q1_2026.csv ]; then cp relatorio_botucatu_q1_2026.csv dist/; fi
          if [ -f caged_comparativo_municipios.csv ]; then cp caged_comparativo_municipios.csv dist/; fi
          if [ -f investimentos_botucatu_2026.csv ]; then cp investimentos_botucatu_2026.csv dist/; fi
          if [ -f estban_botucatu_2025_2026.csv ]; then cp estban_botucatu_2025_2026.csv dist/; fi
          for f in cnpj_botucatu_resumo.csv cnpj_botucatu_mei_mensal.csv cnpj_botucatu_porte_pct.csv cnpj_botucatu_cnae_x_tipo.csv \
            cnpj_botucatu_join_empresas.csv cnpj_botucatu_meis.csv cnpj_botucatu_municipio_fonte.csv; do
            if [ -f "$f" ]; then cp "$f" dist/; fi
          done
          for f in comex_botucatu_mensal.csv comex_botucatu_top_sh4_export.csv comex_botucatu_top_sh4_import.csv comex_botucatu_meta.csv; do
            if [ -f "$f" ]; then cp "$f" dist/; fi
          done
          tar -czf observatorio-botucatu.tar.gz dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: observatorio-botucatu-build
          path: observatorio-botucatu.tar.gz

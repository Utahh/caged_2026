name: CI-CD

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  ci:
    name: Continuous Integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Python syntax
        run: python -m py_compile app.py

      - name: Streamlit smoke import
        run: python -c "import streamlit, pandas, plotly; print('deps ok')"

  cd:
    name: Continuous Delivery
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create deployable artifact
        run: |
          mkdir -p dist
          cp app.py requirements.txt README.md dist/
          if [ -f relatorio_botucatu_q1_2026.csv ]; then cp relatorio_botucatu_q1_2026.csv dist/; fi
          if [ -f investimentos_botucatu_2026.csv ]; then cp investimentos_botucatu_2026.csv dist/; fi
          tar -czf observatorio-botucatu.tar.gz dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: observatorio-botucatu-build
          path: observatorio-botucatu.tar.gz

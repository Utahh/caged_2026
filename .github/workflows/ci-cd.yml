name: CI-CD

on:
  workflow_dispatch:
  schedule:
    # 06:00 UTC (03:00 BRT), todos os dias
    - cron: "0 6 * * *"
  pull_request:
  push:
    branches:
      - main

jobs:
  ci:
    name: Continuous Integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Python syntax
        run: python -m py_compile app.py pipeline_botucatu.py

      - name: Streamlit smoke import
        run: python -c "import streamlit, pandas, plotly; print('deps ok')"

  refresh-data:
    name: Refresh Botucatu datasets
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run ETL pipeline
        run: python pipeline_botucatu.py

      - name: Commit refreshed CSVs (if changed)
        run: |
          git add caged_botucatu_q1_2026.csv financas_botucatu_2026.csv estban_botucatu_2025_2026.csv relatorio_botucatu_q1_2026.csv investimentos_botucatu_2026.csv
          if git diff --staged --quiet; then
            echo "No dataset changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh Botucatu datasets via pipeline"
          git push

  cd:
    name: Continuous Delivery
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create deployable artifact
        run: |
          mkdir -p dist
          cp app.py requirements.txt README.md dist/
          if [ -f relatorio_botucatu_q1_2026.csv ]; then cp relatorio_botucatu_q1_2026.csv dist/; fi
          if [ -f investimentos_botucatu_2026.csv ]; then cp investimentos_botucatu_2026.csv dist/; fi
          if [ -f estban_botucatu_2025_2026.csv ]; then cp estban_botucatu_2025_2026.csv dist/; fi
          tar -czf observatorio-botucatu.tar.gz dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: observatorio-botucatu-build
          path: observatorio-botucatu.tar.gz
